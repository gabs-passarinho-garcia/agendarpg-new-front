<div class="tag-edit-modal">
  <div class="modal-header">
    <h2 mat-dialog-title>
      <mat-icon>edit</mat-icon>
      Editar tag
    </h2>
    <button mat-icon-button type="button" (click)="close()" aria-label="Fechar modal">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content class="modal-content">
    <form [formGroup]="form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Tag</mat-label>
        <input matInput formControlName="tag" placeholder="Ex.: Dungeons & Dragons">
        @if (form.get('tag')?.hasError('required')) {
          <mat-error>Tag é obrigatória.</mat-error>
        }
        @if (form.get('tag')?.hasError('minlength')) {
          <mat-error>Tag deve ter pelo menos 2 caracteres.</mat-error>
        }
      </mat-form-field>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions class="modal-actions" align="end">
    <button mat-stroked-button type="button" (click)="close()">Cancelar</button>
    <button mat-raised-button color="primary" type="button" (click)="save()" [disabled]="form.invalid">Salvar</button>
  </mat-dialog-actions>
</div>
